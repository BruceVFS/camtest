<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Link Test</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background:
        radial-gradient(circle at top left, rgba(0, 0, 0, 0.03) 0, transparent 60%),
        radial-gradient(circle at bottom right, rgba(0, 0, 0, 0.03) 0, transparent 60%),
        #f7f7f9;
    }

    .tools-section {
      padding: 48px 16px 64px;
    }

    .tools-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header "card" */
    .tools-header-card {
      background: linear-gradient(135deg, #ffffff, #f3f4f6);
      border-radius: 28px;
      padding: 22px 28px;
      margin-bottom: 32px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tools-header-icon {
      font-size: 2.6rem;
      color: #2c17a1;
      flex-shrink: 0;
    }

    .tools-header-title {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Grid of cards */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 24px;
    }

    /* Individual tool cards */
    .tool-card {
      position: relative;
      background: linear-gradient(180deg, #ffffff, #f5f5f7);
      border-radius: 26px;
      padding: 24px 20px 64px;
      box-shadow: 0 18px 35px rgba(48, 60, 90, 0.06);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: visible;
    }

    .tool-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 45px rgba(15, 23, 42, 0.12);
    }

    .tool-icon {
      font-size: 0rem;
      margin-bottom: 1px;
      color: #2c17a1;
    }

    .tool-icon i + i {
      margin-left: 6px;
    }

    .tool-title {
      font-size: 1rem;
      font-weight: 900;
      line-height: 3;
    }

    /* Bottom tab */
    .tool-tab {
      position: absolute;
      bottom: 0;
      width: 44%;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      color: #ffffff;
    }

    .tool-tab i {
      font-size: 2.0rem;
      color: #ffffff;
    }

    /* Odd cards: red tab, left side */
    .tools-grid .tool-card:nth-child(odd) .tool-tab {
      background: #2c17a1;
      left: 0;
      border-top-right-radius: 40px;
    }

    /* Even cards: black tab, right side */
    .tools-grid .tool-card:nth-child(even) .tool-tab {
      background: #000000;
      right: 0;
      border-top-left-radius: 40px;
    }

    /* Small screens */
    @media (max-width: 640px) {
      .tools-header-card {
        flex-direction: row;
        align-items: center;
      }

      .tools-header-title {
        font-size: 1.4rem;
      }

      .tool-card {
        padding: 20px 18px 60px;
      }
    }
  </style>


</head>
<body>

  
  <section class="tools-section">
      <a href="https://wa.me/27832577055?text=I%20found%20this%20link%20on%20your%20web%20site" target="_blank">
         <div class="tools-container">
      <header class="tools-header-card">
        <div class="tools-header-icon">
            <i class="fa-brands fa-whatsapp"></i>
        </div>
        <div class="tools-header-title">
          WhatsApp Link Test
    </a>
        </div>
        </header>

      </header>
